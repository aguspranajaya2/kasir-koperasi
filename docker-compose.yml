services:
  mongodb:
    image: mongo:7
    restart: unless-stopped
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 20
  mongo-init:
    image: mongo:7
    depends_on:
      mongodb:
        condition: service_healthy
    volumes:
      - ./infra/mongo/init-replica.js:/scripts/init-replica.js:ro
    entrypoint: ["mongosh", "mongodb://mongodb:27017/admin", "/scripts/init-replica.js"]
    restart: "no"
volumes:
  mongo_data:
